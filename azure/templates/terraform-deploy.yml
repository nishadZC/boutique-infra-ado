parameters:
  - name: environmentName
    type: string
  - name: azureServiceConnection
    type: string
    default: 'Azure Resource Group'
  - name: dependsOn
    type: object
    default: []
  - name: planCondition
    type: string
    default: 'succeeded()'

stages:
- stage: Plan_${{ parameters.environmentName }}
  displayName: 'Plan ${{ parameters.environmentName }} Infrastructure'
  dependsOn: ${{ parameters.dependsOn }}
  condition: ${{ parameters.planCondition }}
  jobs:
  - job: TerraformPlan
    pool:
      name: Default
    steps:
    - task: Bash@3
      displayName: 'Verify Terraform (pre-installed on agent)'
      inputs:
        targetType: 'inline'
        script: |
          terraform version
          echo "Terraform is ready on self-hosted agent."

    - task: AzureCLI@2
      displayName: 'Terraform Plan (${{ parameters.environmentName }})'
      inputs:
        azureSubscription: '${{ parameters.azureServiceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          cd azure/environments/${{ parameters.environmentName }}
          
          terraform fmt -check || echo "Formatting issues found, but continuing..."
          terraform init
          terraform state rm helm_release.argocd 2>/dev/null || true
          terraform validate
          terraform plan -var-file="${{ parameters.environmentName }}.tfvars" -out=$(Build.ArtifactStagingDirectory)/${{ parameters.environmentName }}-tfplan
        addSpnToEnvironment: true
      env:
        TF_VAR_db_password: $(TF_VAR_db_password)
        TF_VAR_pagerduty_key: $(TF_VAR_pagerduty_key)
        TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)
        TF_VAR_cloudinary_cloud_name: $(TF_VAR_cloudinary_cloud_name)
        TF_VAR_cloudinary_api_key: $(TF_VAR_cloudinary_api_key)
        TF_VAR_cloudinary_api_secret: $(TF_VAR_cloudinary_api_secret)
        TF_VAR_google_client_id: $(TF_VAR_google_client_id)
        TF_VAR_azure_maps_subscription_key: $(TF_VAR_azure_maps_subscription_key)
        TF_VAR_razorpay_key_id: $(TF_VAR_razorpay_key_id)
        TF_VAR_razorpay_key_secret: $(TF_VAR_razorpay_key_secret)
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environmentName }}-tfplan'
        artifact: '${{ parameters.environmentName }}-tfplan'
        publishLocation: 'pipeline'

- stage: Apply_${{ parameters.environmentName }}
  displayName: 'Apply ${{ parameters.environmentName }} Infrastructure'
  dependsOn: Plan_${{ parameters.environmentName }}
  condition: succeeded('Plan_${{ parameters.environmentName }}')
  jobs:
  - deployment: TerraformApply
    pool:
      name: Default
    environment: 'azure-${{ parameters.environmentName }}-environment' # Allows manual approvals in DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Bash@3
            displayName: 'Verify Terraform (pre-installed on agent)'
            inputs:
              targetType: 'inline'
              script: |
                terraform version
                echo "Terraform is ready on self-hosted agent."

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Plan'
            inputs:
              buildType: 'current'
              artifactName: '${{ parameters.environmentName }}-tfplan'
              targetPath: '$(Build.ArtifactStagingDirectory)'

          - task: AzureCLI@2
            displayName: 'Terraform Apply (${{ parameters.environmentName }})'
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd azure/environments/${{ parameters.environmentName }}
                terraform init
                terraform apply -auto-approve $(Build.ArtifactStagingDirectory)/${{ parameters.environmentName }}-tfplan
              addSpnToEnvironment: true
            env:
              TF_VAR_db_password: $(TF_VAR_db_password)
              TF_VAR_pagerduty_key: $(TF_VAR_pagerduty_key)
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)
              TF_VAR_cloudinary_cloud_name: $(TF_VAR_cloudinary_cloud_name)
              TF_VAR_cloudinary_api_key: $(TF_VAR_cloudinary_api_key)
              TF_VAR_cloudinary_api_secret: $(TF_VAR_cloudinary_api_secret)
              TF_VAR_google_client_id: $(TF_VAR_google_client_id)
              TF_VAR_azure_maps_subscription_key: $(TF_VAR_azure_maps_subscription_key)
              TF_VAR_razorpay_key_id: $(TF_VAR_razorpay_key_id)
              TF_VAR_razorpay_key_secret: $(TF_VAR_razorpay_key_secret)
          - ${{ if ne(parameters.environmentName, 'shared') }}:
            - task: AzureCLI@2
              displayName: 'Install ArgoCD (${{ parameters.environmentName }})'
              env:
                GITOPS_PAT: $(GITOPS_PAT)
              inputs:
                azureSubscription: '${{ parameters.azureServiceConnection }}'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -e
                  export RG_NAME=$(terraform -chdir=azure/environments/${{ parameters.environmentName }} output -raw resource_group_name)
                  export CLUSTER_NAME=$(terraform -chdir=azure/environments/${{ parameters.environmentName }} output -raw cluster_name)
                  az aks get-credentials --resource-group $RG_NAME --name $CLUSTER_NAME --admin --overwrite-existing
                  helm repo add argo https://argoproj.github.io/argo-helm
                  helm upgrade --install argocd argo/argo-cd --namespace argocd --create-namespace --version 5.46.8 --set server.service.type=ClusterIP
                  
                  cat <<EOF | kubectl apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: repo-boutique-gitops
                    namespace: argocd
                    labels:
                      argocd.argoproj.io/secret-type: repository
                  stringData:
                    type: git
                    url: https://dev.azure.com/makkenamqmb/Boutique%20project/_git/boutique-gitops
                    password: $GITOPS_PAT
                    username: azdevops
                  EOF

            - task: AzureCLI@2
              displayName: 'GitOps Handoff (${{ parameters.environmentName }})'
              condition: and(succeeded(), ne('${{ parameters.environmentName }}', 'shared'))
              env:
                GITOPS_PAT: $(GITOPS_PAT)
              inputs:
                azureSubscription: '${{ parameters.azureServiceConnection }}'
                addSpnToEnvironment: true
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -e
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_CLIENT_SECRET=$servicePrincipalKey
                  export ARM_TENANT_ID=$tenantId
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                  
                  CLIENT_ID=$(terraform -chdir=azure/environments/${{ parameters.environmentName }} output -raw app_identity_client_id)
                  CERT_MANAGER_CLIENT_ID=$(terraform -chdir=azure/environments/${{ parameters.environmentName }} output -raw cert_manager_client_id)
                  KV_URL=$(terraform -chdir=azure/environments/${{ parameters.environmentName }} output -raw keyvault_uri)
                  
                  git config --global user.email "azure-devops@boutique.com"
                  git config --global user.name "Azure DevOps"
                  
                  rm -rf temp-gitops
                  git clone https://azdevops:$GITOPS_PAT@dev.azure.com/makkenamqmb/Boutique%20project/_git/boutique-gitops temp-gitops
                  cd temp-gitops
                  
                  sed -i "s|externalSecretsClientId: .*|externalSecretsClientId: \"$CLIENT_ID\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                  sed -i "s|keyVaultUrl: .*|keyVaultUrl: \"$KV_URL\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                  sed -i "s|tenantId: .*|tenantId: \"$ARM_TENANT_ID\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                  sed -i "s|certManagerClientId: .*|certManagerClientId: \"$CERT_MANAGER_CLIENT_ID\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                  sed -i "s|subscriptionId: .*|subscriptionId: \"$ARM_SUBSCRIPTION_ID\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml                  
                  git add azure/system-apps/
                  git diff --staged --quiet || git commit -m "chore: inject Workload Identity variables for ${{ parameters.environmentName }}"
                  git push origin HEAD:master
