parameters:
  - name: environmentName
    type: string
  - name: azureServiceConnection
    type: string
    default: 'Azure Resource Group'
  - name: dependsOn
    type: object
    default: []
  - name: acrName
    type: string

stages:
- stage: PlanDestroy_${{ parameters.environmentName }}
  displayName: 'Plan Destroy ${{ parameters.environmentName }} Infrastructure'
  dependsOn: ${{ parameters.dependsOn }}
  jobs:
  - job: TerraformPlanDestroy
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: Bash@3
      displayName: 'Verify Terraform (pre-installed on agent)'
      inputs:
        targetType: 'inline'
        script: |
          terraform version
          echo "Terraform is ready on self-hosted agent."

    - task: AzureCLI@2
      displayName: 'Terraform Plan Destroy (${{ parameters.environmentName }})'
      inputs:
        azureSubscription: '${{ parameters.azureServiceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          cd azure/environments/${{ parameters.environmentName }}
          terraform init
          terraform plan -destroy -var-file="${{ parameters.environmentName }}.tfvars"
        addSpnToEnvironment: true
      env:
        TF_VAR_acr_name: ${{ parameters.acrName }}
        TF_VAR_db_password: $(TF_VAR_db_password)
        TF_VAR_pagerduty_key: $(TF_VAR_pagerduty_key)
        TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)
        TF_VAR_cloudinary_cloud_name: $(TF_VAR_cloudinary_cloud_name)
        TF_VAR_cloudinary_api_key: $(TF_VAR_cloudinary_api_key)
        TF_VAR_cloudinary_api_secret: $(TF_VAR_cloudinary_api_secret)
        TF_VAR_google_client_id: $(TF_VAR_google_client_id)
        TF_VAR_azure_maps_subscription_key: $(TF_VAR_azure_maps_subscription_key)
        TF_VAR_razorpay_key_id: $(TF_VAR_razorpay_key_id)
        TF_VAR_razorpay_key_secret: $(TF_VAR_razorpay_key_secret)
        TF_VAR_grafana_admin_user: $(TF_VAR_grafana_admin_user)
        TF_VAR_grafana_admin_password: $(TF_VAR_grafana_admin_password)
        TF_VAR_jwt_secret: $(TF_VAR_jwt_secret)

- stage: ApplyDestroy_${{ parameters.environmentName }}
  displayName: 'Apply Destroy ${{ parameters.environmentName }} Infrastructure'
  dependsOn: PlanDestroy_${{ parameters.environmentName }}
  condition: succeeded('PlanDestroy_${{ parameters.environmentName }}')
  jobs:
  - deployment: TerraformApplyDestroy
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'azure-${{ parameters.environmentName }}-environment' # Triggers manual approvals in DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Bash@3
            displayName: 'Verify Terraform (pre-installed on agent)'
            inputs:
              targetType: 'inline'
              script: |
                terraform version
                echo "Terraform is ready on self-hosted agent."

          - task: AzureCLI@2
            displayName: 'Terraform Destroy (${{ parameters.environmentName }})'
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd azure/environments/${{ parameters.environmentName }}
                terraform init
                terraform destroy -auto-approve -var-file="${{ parameters.environmentName }}.tfvars"
              addSpnToEnvironment: true
            env:
              TF_VAR_acr_name: ${{ parameters.acrName }}
              TF_VAR_db_password: $(TF_VAR_db_password)
              TF_VAR_pagerduty_key: $(TF_VAR_pagerduty_key)
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)
              TF_VAR_cloudinary_cloud_name: $(TF_VAR_cloudinary_cloud_name)
              TF_VAR_cloudinary_api_key: $(TF_VAR_cloudinary_api_key)
              TF_VAR_cloudinary_api_secret: $(TF_VAR_cloudinary_api_secret)
              TF_VAR_google_client_id: $(TF_VAR_google_client_id)
              TF_VAR_azure_maps_subscription_key: $(TF_VAR_azure_maps_subscription_key)
              TF_VAR_razorpay_key_id: $(TF_VAR_razorpay_key_id)
              TF_VAR_razorpay_key_secret: $(TF_VAR_razorpay_key_secret)
              TF_VAR_grafana_admin_user: $(TF_VAR_grafana_admin_user)
              TF_VAR_grafana_admin_password: $(TF_VAR_grafana_admin_password)
              TF_VAR_jwt_secret: $(TF_VAR_jwt_secret)
          - task: AzureCLI@2
            displayName: 'GitOps Cleanup Handoff (${{ parameters.environmentName }})'
            condition: and(succeeded(), ne('${{ parameters.environmentName }}', 'shared'))
            env:
              GITOPS_PAT: $(GITOPS_PAT)
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              addSpnToEnvironment: true
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                
                git config --global user.email "azure-devops@boutique.com"
                git config --global user.name "Azure DevOps"
                
                rm -rf temp-gitops
                git clone https://azdevops:$GITOPS_PAT@dev.azure.com/luxatelier/boutique-app/_git/boutique-gitops temp-gitops
                cd temp-gitops
                
                sed -i "s|externalSecretsClientId: .*|externalSecretsClientId: \"\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                sed -i "s|keyVaultUrl: .*|keyVaultUrl: \"\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                sed -i "s|tenantId: .*|tenantId: \"\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                sed -i "s|certManagerClientId: .*|certManagerClientId: \"\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml
                sed -i "s|subscriptionId: .*|subscriptionId: \"\"|g" azure/system-apps/values-${{ parameters.environmentName }}.yaml                  
                git add azure/system-apps/
                git diff --staged --quiet || git commit -m "chore: clean up Workload Identity variables for ${{ parameters.environmentName }} after destroy"
                git push origin HEAD:main
