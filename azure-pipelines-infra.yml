trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - azure/environments/**
      - azure/modules/**
      - azure/templates/terraform-*.yml
      - azure-pipelines-infra.yml

# Only dev is provisioned for now. QA/Staging/Prod stay in the pipeline but are
# opt-in: tick them at queue time once those environments are wanted.
parameters:
  - name: runDev
    displayName: "Run Dev Environment"
    type: boolean
    default: true
  - name: runQa
    displayName: "Run QA Environment"
    type: boolean
    default: false
  - name: runStaging
    displayName: "Run Staging Environment"
    type: boolean
    default: false
  - name: runProd
    displayName: "Run Prod Environment"
    type: boolean
    default: false

variables:
  - group: acr-registries
  - name: azureServiceConnection
    value: 'Azure Resource Group'

stages:

  # ==========================================
  # DEV ENVIRONMENT
  # ==========================================
  - ${{ if eq(parameters.runDev, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'dev'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(devAcr)
        dependsOn: []

  # ==========================================
  # QA ENVIRONMENT
  # ==========================================
  - ${{ if eq(parameters.runQa, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'qa'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(qaAcr)
        ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
          dependsOn: []
        ${{ elseif eq(parameters.runDev, true) }}:
          dependsOn: ['Apply_dev']
        ${{ else }}:
          dependsOn: []

  # ==========================================
  # STAGING ENVIRONMENT
  # ==========================================
  - ${{ if eq(parameters.runStaging, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'staging'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(stagingAcr)
        ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
          dependsOn: []
        ${{ elseif eq(parameters.runQa, true) }}:
          dependsOn: ['Apply_qa']
        ${{ else }}:
          dependsOn: []

  # ==========================================
  # PROD ENVIRONMENT
  # Image promotion to the prod ACR is an application release concern and
  # belongs in the prod Release pipeline, not here.
  # ==========================================
  - ${{ if eq(parameters.runProd, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'prod'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(prodAcr)
        ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
          dependsOn: []
        ${{ elseif eq(parameters.runStaging, true) }}:
          dependsOn: ['Apply_staging']
        ${{ else }}:
          dependsOn: []
