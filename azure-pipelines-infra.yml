trigger: none

parameters:
  - name: runShared
    displayName: "Run Shared Environment"
    type: boolean
    default: true

variables:
  azureServiceConnection: 'Azure Resource Group'
  tfstateResourceGroup: 'tfstate-rg'
  tfstateStorageAccount: 'boutiquetfstate2026'
  tfstateContainer: 'tfstate'

stages:

  # ==========================================
  # SHARED ENVIRONMENT
  # (Contains ACR, SonarQube - required by other envs)
  # ==========================================
  - ${{ if eq(parameters.runShared, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'shared'
        azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # DEV ENVIRONMENT
  # ==========================================
  - template: azure/templates/terraform-deploy.yml
    parameters:
      environmentName: 'dev'
      azureServiceConnection: $(azureServiceConnection)
      ${{ if eq(parameters.runShared, true) }}:
        dependsOn: ['Apply_shared']
      ${{ if eq(parameters.runShared, false) }}:
        dependsOn: []

