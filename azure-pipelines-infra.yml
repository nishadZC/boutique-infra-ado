trigger:
  branches:
    include:
    - master
  paths:
    include:
    - azure/*

variables:
  azureServiceConnection: 'Azure Resource Group'
  tfstateResourceGroup: 'tfstate-rg'
  tfstateStorageAccount: 'boutiquetfstate2026'
  tfstateContainer: 'tfstate'

stages:
# ==========================================
# PROD ENVIRONMENT
# ==========================================
- stage: PlanProd
  displayName: 'Plan Prod Infrastructure'
  jobs:
  - job: TerraformPlanProd
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Bash@3
      displayName: 'Install Terraform'
      inputs:
        targetType: 'inline'
        script: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform

    - task: AzureCLI@2
      displayName: 'Terraform Plan (Prod)'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          cd azure/environments/prod
          
          terraform fmt -check || echo "Formatting issues found, but continuing..."
          terraform init
          terraform validate
          terraform plan -var-file="prod.tfvars" -out=$(Build.ArtifactStagingDirectory)/prod-tfplan
        addSpnToEnvironment: true
      env:
        TF_VAR_db_password: $(TF_VAR_db_password)
        TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Prod Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/prod-tfplan'
        artifact: 'prod-tfplan'
        publishLocation: 'pipeline'

- stage: ApplyProd
  displayName: 'Apply Prod Infrastructure'
  dependsOn: PlanProd
  jobs:
  - deployment: TerraformApplyProd
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'azure-prod-environment' # This allows manual approvals in DevOps!
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Bash@3
            displayName: 'Install Terraform'
            inputs:
              targetType: 'inline'
              script: |
                wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                sudo apt update && sudo apt install terraform

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Prod Plan'
            inputs:
              buildType: 'current'
              artifactName: 'prod-tfplan'
              targetPath: '$(Build.ArtifactStagingDirectory)'

          - task: AzureCLI@2
            displayName: 'Terraform Apply (Prod)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd azure/environments/prod
                terraform init
                terraform apply -auto-approve $(Build.ArtifactStagingDirectory)/prod-tfplan
              addSpnToEnvironment: true
            env:
              TF_VAR_db_password: $(TF_VAR_db_password)
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)
