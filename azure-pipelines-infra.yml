trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - azure/environments/**
      - azure/templates/**

parameters:
  - name: runDev
    displayName: "Run Dev Environment"
    type: boolean
    default: true
  - name: runQa
    displayName: "Run QA Environment"
    type: boolean
    default: true
  - name: runStaging
    displayName: "Run Staging Environment"
    type: boolean
    default: true
  - name: runProdRelease
    displayName: "Run Promote + Prod"
    type: boolean
    default: true

variables:
  - group: acr-registries
  - name: azureServiceConnection
    value: 'Azure Resource Group'

stages:

  # ==========================================
  # DEV ENVIRONMENT
  # ==========================================
  - ${{ if eq(parameters.runDev, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'dev'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(devAcr)
        dependsOn: []

  # ==========================================
  # QA ENVIRONMENT
  # ==========================================
  - ${{ if eq(parameters.runQa, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'qa'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(qaAcr)
        ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
          dependsOn: []
        ${{ elseif eq(parameters.runDev, true) }}:
          dependsOn: ['Apply_dev']
        ${{ else }}:
          dependsOn: []

  # ==========================================
  # STAGING ENVIRONMENT
  # ==========================================
  - ${{ if eq(parameters.runStaging, true) }}:
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'staging'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(stagingAcr)
        ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
          dependsOn: []
        ${{ elseif eq(parameters.runQa, true) }}:
          dependsOn: ['Apply_qa']
        ${{ else }}:
          dependsOn: []

  # ==========================================
  # PROMOTE IMAGES: staging-acr → prod-acr
  # Runs after staging is verified and approved.
  # Copies only the validated image tags to the prod ACR.
  # Prod AKS has AcrPull on prod-acr only — it cannot pull from staging-acr.
  # Gated behind runProdRelease so lower-env-only runs can skip it.
  # ==========================================
  - ${{ if eq(parameters.runProdRelease, true) }}:
    - stage: Promote_Images_To_Prod
      displayName: 'Promote Images to Prod ACR'
      ${{ if eq(parameters.runStaging, true) }}:
        dependsOn: ['Apply_staging']
        condition: and(succeeded('Apply_staging'), ne(variables['Build.Reason'], 'PullRequest'))
      ${{ else }}:
        dependsOn: []
        condition: ne(variables['Build.Reason'], 'PullRequest')
      jobs:
      - deployment: PromoteImages
        pool:
          name: Default
        environment: 'azure-prod-promote-environment' # Manual approval gate: confirms staging passed before images go to prod ACR
        strategy:
          runOnce:
            deploy:
              steps:
              - task: AzureCLI@2
                displayName: 'Copy images from staging-acr to prod-acr'
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    set -e
                    echo "Promoting image tag: $(IMAGE_TAG)"

                    STAGING_ACR="$(stagingAcr).azurecr.io"
                    PROD_ACR="$(prodAcr).azurecr.io"

                    # Login to both registries
                    az acr login --name $(stagingAcr)
                    az acr login --name $(prodAcr)

                    # Copy each service image from staging (last validated env) → prod ACR
                    # az acr import is atomic and doesn't require docker daemon
                    for SERVICE in backend frontend; do
                      echo "Promoting $SERVICE:$(IMAGE_TAG)"
                      az acr import \
                        --name $(prodAcr) \
                        --source $STAGING_ACR/$SERVICE:$(IMAGE_TAG) \
                        --image $SERVICE:$(IMAGE_TAG) \
                        --force
                    done

                    echo "Promotion complete. Prod ACR now has image tag: $(IMAGE_TAG)"

    # ==========================================
    # PROD ENVIRONMENT
    # ==========================================
    - template: azure/templates/terraform-deploy.yml
      parameters:
        environmentName: 'prod'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(prodAcr)
        ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
          dependsOn: []
        ${{ else }}:
          dependsOn: ['Promote_Images_To_Prod']
