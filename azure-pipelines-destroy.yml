trigger: none

parameters:
  - name: runDev
    displayName: "Destroy Dev"
    type: boolean
    default: false
  - name: runQa
    displayName: "Destroy QA"
    type: boolean
    default: false
  - name: runStaging
    displayName: "Destroy Staging"
    type: boolean
    default: false
  - name: runProdDestroy
    displayName: "Destroy Prod (danger)"
    type: boolean
    default: false

variables:
  - group: acr-registries
  - name: azureServiceConnection
    value: 'Azure Resource Group'

stages:
  # ==========================================
  # DEV ENVIRONMENT DESTROY
  # ==========================================
  - ${{ if eq(parameters.runDev, true) }}:
    - template: azure/templates/terraform-destroy.yml
      parameters:
        environmentName: 'dev'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(devAcr)

  # ==========================================
  # QA ENVIRONMENT DESTROY
  # ==========================================
  - ${{ if eq(parameters.runQa, true) }}:
    - template: azure/templates/terraform-destroy.yml
      parameters:
        environmentName: 'qa'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(qaAcr)

  # ==========================================
  # STAGING ENVIRONMENT DESTROY
  # ==========================================
  - ${{ if eq(parameters.runStaging, true) }}:
    - template: azure/templates/terraform-destroy.yml
      parameters:
        environmentName: 'staging'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(stagingAcr)

  # ==========================================
  # PROD ENVIRONMENT DESTROY
  # Disabled by default — requires explicitly checking runProdDestroy
  # at queue time, in addition to the environment approval gate.
  # ==========================================
  - ${{ if eq(parameters.runProdDestroy, true) }}:
    - template: azure/templates/terraform-destroy.yml
      parameters:
        environmentName: 'prod'
        azureServiceConnection: $(azureServiceConnection)
        acrName: $(prodAcr)
