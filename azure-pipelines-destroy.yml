trigger: none

variables:
  azureServiceConnection: 'Azure Resource Group'
  tfstateResourceGroup: 'tfstate-rg'
  tfstateStorageAccount: 'boutiquetfstate2026v2'
  tfstateContainer: 'tfstate'

stages:
  # ==========================================
  # DEV ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'dev'
      azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # QA ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'qa'
      azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # STAGING ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'staging'
      azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # PROD ENVIRONMENT DESTROY (Commented out for now)
  # ==========================================
  # - template: azure/templates/terraform-destroy.yml
  #   parameters:
  #     environmentName: 'prod'
  #     azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # SHARED ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'shared'
      azureServiceConnection: $(azureServiceConnection)
      dependsOn: ['ApplyDestroy_dev', 'ApplyDestroy_qa', 'ApplyDestroy_staging']
