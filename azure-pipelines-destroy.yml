trigger: none

parameters:
  - name: environmentName
    displayName: "Environment to Destroy"
    type: string
    default: 'dev'
    values:
      - dev
      - qa
      - staging
      - shared
      - prod
  - name: confirmProdDestroy
    displayName: "Confirm Prod Destroy (danger — required if Environment is 'prod')"
    type: boolean
    default: false

variables:
  azureServiceConnection: 'Azure Resource Group'

stages:
  # ==========================================
  # SAFETY GUARD: block prod unless explicitly confirmed
  # ==========================================
  - ${{ if and(eq(parameters.environmentName, 'prod'), ne(parameters.confirmProdDestroy, true)) }}:
    - stage: BlockedProdDestroy
      displayName: 'Blocked: Prod Destroy Not Confirmed'
      jobs:
      - job: Blocked
        pool:
          name: Default
        steps:
        - script: |
            echo "##vso[task.logissue type=error]Environment 'prod' selected but 'confirmProdDestroy' was not checked. Re-run with confirmProdDestroy=true to destroy prod."
            exit 1

  # ==========================================
  # DESTROY SELECTED ENVIRONMENT
  # ==========================================
  - ${{ if not(and(eq(parameters.environmentName, 'prod'), ne(parameters.confirmProdDestroy, true))) }}:
    - template: azure/templates/terraform-destroy.yml
      parameters:
        environmentName: '${{ parameters.environmentName }}'
        azureServiceConnection: $(azureServiceConnection)
