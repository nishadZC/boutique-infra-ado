trigger: none

variables:
  azureServiceConnection: 'Azure Resource Group'
  tfstateResourceGroup: 'tfstate-rg'
  tfstateStorageAccount: 'boutiquetfstate2026'
  tfstateContainer: 'tfstate'

stages:
# ==========================================
# PLAN DESTROY ENVIRONMENT
# ==========================================
- stage: PlanDestroy
  displayName: 'Plan Infrastructure Destroy'
  jobs:
  - job: TerraformPlanDestroy
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: Bash@3
      displayName: 'Install Terraform'
      inputs:
        targetType: 'inline'
        script: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform

    - task: AzureCLI@2
      displayName: 'Terraform Plan Destroy (Dev)'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          cd azure/environments/dev
          terraform init
          terraform plan -destroy -var-file="dev.tfvars"
        addSpnToEnvironment: true
      env:
        TF_VAR_db_password: $(TF_VAR_db_password)
        TF_VAR_pagerduty_key: $(TF_VAR_pagerduty_key)
        TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

    - task: AzureCLI@2
      displayName: 'Terraform Plan Destroy (Shared)'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          cd azure/environments/shared
          terraform init
          terraform plan -destroy -var-file="shared.tfvars"
        addSpnToEnvironment: true

# ==========================================
# APPLY DESTROY ENVIRONMENT
# ==========================================
- stage: ApplyDestroy
  displayName: 'Apply Infrastructure Destroy'
  dependsOn: PlanDestroy
  jobs:
  - deployment: TerraformApplyDestroy
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'azure-dev-environment' # This will trigger the one manual approval
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Bash@3
            displayName: 'Install Terraform'
            inputs:
              targetType: 'inline'
              script: |
                wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                sudo apt update && sudo apt install terraform

          - task: AzureCLI@2
            displayName: 'Terraform Destroy (Dev)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd azure/environments/dev
                terraform init
                terraform destroy -auto-approve -var-file="dev.tfvars"
              addSpnToEnvironment: true
            env:
              TF_VAR_db_password: $(TF_VAR_db_password)
              TF_VAR_pagerduty_key: $(TF_VAR_pagerduty_key)
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)

          - task: AzureCLI@2
            displayName: 'Terraform Destroy (Shared)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd azure/environments/shared
                terraform init
                terraform destroy -auto-approve -var-file="shared.tfvars"
              addSpnToEnvironment: true
