trigger: none

parameters:
  - name: runProdDestroy
    displayName: "Destroy Prod (danger)"
    type: boolean
    default: false

variables:
  azureServiceConnection: 'Azure Resource Group'

stages:
  # ==========================================
  # DEV ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'dev'
      azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # QA ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'qa'
      azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # STAGING ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'staging'
      azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # PROD ENVIRONMENT DESTROY
  # Disabled by default — requires explicitly setting runProdDestroy=true
  # at queue time, in addition to the environment approval gate.
  # ==========================================
  - ${{ if eq(parameters.runProdDestroy, true) }}:
    - template: azure/templates/terraform-destroy.yml
      parameters:
        environmentName: 'prod'
        azureServiceConnection: $(azureServiceConnection)

  # ==========================================
  # SHARED ENVIRONMENT DESTROY
  # ==========================================
  - template: azure/templates/terraform-destroy.yml
    parameters:
      environmentName: 'shared'
      azureServiceConnection: $(azureServiceConnection)
      dependsOn: ['ApplyDestroy_dev', 'ApplyDestroy_qa', 'ApplyDestroy_staging']
