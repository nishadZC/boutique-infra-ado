grafana:
  service:
    type: ClusterIP
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: azure/application-gateway
      appgw.ingress.kubernetes.io/health-probe-path: /api/health
    path: /grafana
    pathType: Prefix
  grafana.ini:
    server:
      serve_from_sub_path: true
    security:
      cookie_secure: true
  persistence:
    enabled: false
  serviceMonitor:
    relabelings:
      - action: replace
        targetLabel: job
        replacement: grafana

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 7d
    retentionSize: 15GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
  serviceMonitor:
    relabelings:
      - action: replace
        targetLabel: job
        replacement: prometheus

alertmanager:
  serviceMonitor:
    relabelings:
      - action: replace
        targetLabel: job
        replacement: alertmanager
  alertmanagerSpec:
    secrets:
      - pagerduty-secret
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: pagerduty
      group_by: ['environment', 'alertname', 'namespace', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - 'severity = critical'
          receiver: pagerduty
        - matchers:
            - 'severity = none'
          receiver: 'null'
    receivers:
      - name: pagerduty
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/pagerduty-secret/pagerduty-key
            send_resolved: true
            severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
            description: '[{{ .CommonLabels.environment | toUpper }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}'
            client: 'Alertmanager ({{ .CommonLabels.environment }})'
            details:
              environment: '{{ .CommonLabels.environment }}'
              summary: '{{ .CommonAnnotations.summary }}'
              description: '{{ .CommonAnnotations.description }}'
              firing: '{{ .Alerts.Firing | len }}'
      - name: 'null'

kube-state-metrics:
  prometheus:
    monitor:
      relabelings:
        - action: replace
          targetLabel: job
          replacement: kube-state-metrics

prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - action: replace
          targetLabel: job
          replacement: node-exporter
