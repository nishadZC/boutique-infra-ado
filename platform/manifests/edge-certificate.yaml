apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-tls
  namespace: cert-manager
spec:
  secretName: edge-tls
  dnsNames:
    - "${APP_HOST}"
  issuerRef:
    kind: ClusterIssuer
    name: "${CLUSTER_ISSUER}"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "${EDGE_TLS_NAMESPACES}"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "${EDGE_TLS_NAMESPACES}"
