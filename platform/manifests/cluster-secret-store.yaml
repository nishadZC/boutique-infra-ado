apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      tenantId: "${TENANT_ID}"
      vaultUrl: "${KV_URL}"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
