# Mounted into Alertmanager (alertmanagerSpec.secrets). Lives in the platform
# layer, not the app chart, because Alertmanager cannot start without it.
# Key Vault secret pagerduty-key is created by Terraform.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pagerduty-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-store
    kind: ClusterSecretStore
  target:
    name: pagerduty-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pagerduty-key
      remoteRef:
        key: pagerduty-key
