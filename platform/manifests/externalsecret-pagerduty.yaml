apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pagerduty-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-store
    kind: ClusterSecretStore
  target:
    name: pagerduty-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pagerduty-key
      remoteRef:
        key: pagerduty-key
