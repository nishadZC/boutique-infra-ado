# Scrapes cert-manager's metrics and alerts before a certificate expires.
# cert-manager renews edge-tls ~30 days before expiry, so "less than 21 days
# left" only fires when renewal has been failing for over a week. Let's Encrypt
# no longer emails expiry warnings, so these alerts are the only warning.
# Applied by platform/scripts/deploy.sh after kube-prometheus-stack (needs its CRDs).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: tcp-prometheus-servicemonitor
      interval: 60s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: cert-manager
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertManagerDown
          expr: absent(up{job="cert-manager"} == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: cert-manager is not running
            description: Certificates cannot be issued or renewed until cert-manager is back.
        - alert: CertificateNotReady
          expr: max by (namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready'
            description: 'Run: kubectl describe certificate -n {{ $labels.namespace }} {{ $labels.name }}'
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 21 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}'
            description: Renewal should have happened ~30 days before expiry and has not. Check cert-manager logs and the certificate's ACME challenges.
        - alert: CertificateExpiryCritical
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}'
            description: After expiry browsers block the site. Fix renewal now.
